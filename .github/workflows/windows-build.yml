name: Build Polza Agent Studio for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    name: Windows x64 Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Clean npm cache
        shell: powershell
        run: |
          npm cache clean --force

      - name: Install frontend dependencies
        shell: powershell
        run: |
          npm install --include=optional --no-audit --no-fund

      - name: Repair Rollup Windows optional dependency
        shell: powershell
        run: |
          npm install @rollup/rollup-win32-x64-msvc --no-save --no-audit --no-fund

      - name: Verify Rollup Windows dependency
        shell: powershell
        run: |
          node -e "require.resolve('@rollup/rollup-win32-x64-msvc'); console.log('Rollup Windows native package: PASS')"

      - name: TypeScript check
        shell: powershell
        run: |
          npm run typecheck

      - name: Run tests
        shell: powershell
        run: |
          npm test

      - name: Build Tauri Windows application
        shell: powershell
        run: |
          npm run tauri -- build

      - name: Verify Windows installer
        shell: powershell
        run: |
          $installerDir = "src-tauri\target\release\bundle\nsis"

          if (!(Test-Path $installerDir)) {
            throw "NSIS installer directory was not created."
          }

          $installers = @(Get-ChildItem $installerDir -Filter *.exe -File)

          if ($installers.Count -eq 0) {
            throw "No Windows installer EXE was created."
          }

          foreach ($installer in $installers) {
            Write-Host ""
            Write-Host "Installer: $($installer.FullName)"
            Write-Host "Size: $($installer.Length) bytes"

            if ($installer.Length -le 0) {
              throw "Installer has invalid size."
            }

            $bytes = [System.IO.File]::ReadAllBytes($installer.FullName)

            if (
              $bytes.Length -lt 2 -or
              $bytes[0] -ne 0x4D -or
              $bytes[1] -ne 0x5A
            ) {
              throw "$($installer.Name) is not a valid Windows executable."
            }

            $hash = Get-FileHash $installer.FullName -Algorithm SHA256

            Write-Host "SHA256: $($hash.Hash)"
            Write-Host "Windows EXE verification: PASS"
          }

      - name: Verify application executable
        shell: powershell
        run: |
          $appExe = "src-tauri\target\release\polza-agent-studio.exe"

          if (!(Test-Path $appExe)) {
            throw "Application executable was not created: $appExe"
          }

          $file = Get-Item $appExe

          Write-Host "Application EXE: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"

          if ($file.Length -le 0) {
            throw "Application executable has invalid size."
          }

          $bytes = [System.IO.File]::ReadAllBytes($appExe)

          if (
            $bytes.Length -lt 2 -or
            $bytes[0] -ne 0x4D -or
            $bytes[1] -ne 0x5A
          ) {
            throw "Application executable is not a valid Windows executable."
          }

          $hash = Get-FileHash $appExe -Algorithm SHA256

          Write-Host "SHA256: $($hash.Hash)"
          Write-Host "Application EXE verification: PASS"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Polza-Agent-Studio-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload application executable
        uses: actions/upload-artifact@v4
        with:
          name: Polza-Agent-Studio-Windows-Portable
          path: src-tauri/target/release/polza-agent-studio.exe
          if-no-files-found: error

      - name: Final build summary
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "POLZA AGENT STUDIO WINDOWS BUILD SUCCESS"
          Write-Host "=========================================="
          Write-Host ""

          Get-ChildItem `
            "src-tauri\target\release\bundle\nsis" `
            -Filter *.exe `
            -File |
            ForEach-Object {
              Write-Host "INSTALLER: $($_.Name)"
              Write-Host "SIZE: $($_.Length) bytes"
              Write-Host "SHA256: $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)"
            }

          Write-Host ""

          $app = Get-Item "src-tauri\target\release\polza-agent-studio.exe"

          Write-Host "APPLICATION: $($app.Name)"
          Write-Host "SIZE: $($app.Length) bytes"
          Write-Host "SHA256: $((Get-FileHash $app.FullName -Algorithm SHA256).Hash)"

          Write-Host ""
          Write-Host "BUILD STATUS: SUCCESS"
