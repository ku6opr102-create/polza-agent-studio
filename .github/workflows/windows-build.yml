name: Build Polza Agent Studio for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    name: Windows x64 Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify toolchain
        shell: powershell
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Clean npm cache
        shell: powershell
        run: |
          npm cache clean --force

      - name: Remove old npm installation state
        shell: powershell
        run: |
          if (Test-Path node_modules) {
            Remove-Item node_modules -Recurse -Force
          }

          if (Test-Path package-lock.json) {
            Remove-Item package-lock.json -Force
          }

      - name: Install frontend dependencies
        shell: powershell
        run: |
          npm install --include=optional --no-audit --no-fund

      - name: Install Rollup Windows native dependency
        shell: powershell
        run: |
          npm install @rollup/rollup-win32-x64-msvc --no-save --no-audit --no-fund

      - name: Verify Rollup Windows native dependency
        shell: powershell
        run: |
          node -e "require.resolve('@rollup/rollup-win32-x64-msvc'); console.log('Rollup Windows native package: PASS')"

      - name: Verify project files
        shell: powershell
        run: |
          $required = @(
            "package.json",
            "index.html",
            "tsconfig.json",
            "vite.config.ts",
            "src\App.tsx",
            "src\polza.ts",
            "src\tauri.ts",
            "src\types.ts",
            "src-tauri\Cargo.toml",
            "src-tauri\build.rs",
            "src-tauri\tauri.conf.json",
            "src-tauri\src\lib.rs",
            "src-tauri\src\main.rs"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Required project file is missing: $file"
            }

            Write-Host "FOUND: $file"
          }

          Write-Host "Project file verification: PASS"

      - name: Inspect Cargo targets
        shell: powershell
        working-directory: src-tauri
        run: |
          cargo metadata --no-deps --format-version 1 > cargo-metadata.json

          $metadata = Get-Content cargo-metadata.json -Raw | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq "polza-agent-studio" }

          if ($null -eq $package) {
            throw "Cargo package polza-agent-studio was not found."
          }

          Write-Host "Cargo package: $($package.name)"
          Write-Host "Cargo version: $($package.version)"

          foreach ($target in $package.targets) {
            Write-Host "TARGET: $($target.name)"
            Write-Host "KINDS: $($target.kind -join ',')"
          }

          $binary = $package.targets |
            Where-Object {
              $_.name -eq "polza-agent-studio" -and
              ($_.kind -contains "bin")
            }

          if ($null -eq $binary) {
            throw "Cargo binary target polza-agent-studio was not found."
          }

          Write-Host "Cargo binary target verification: PASS"

      - name: TypeScript check
        shell: powershell
        run: |
          npm run typecheck

      - name: Run tests
        shell: powershell
        run: |
          npm test

      - name: Build frontend
        shell: powershell
        run: |
          npm run build

      - name: Verify frontend build
        shell: powershell
        run: |
          if (!(Test-Path "dist")) {
            throw "Frontend dist directory was not created."
          }

          $index = "dist\index.html"

          if (!(Test-Path $index)) {
            throw "dist\index.html was not created."
          }

          Write-Host "Frontend build verification: PASS"

      - name: Build Tauri Windows application
        shell: powershell
        run: |
          npm run tauri -- build --target x86_64-pc-windows-msvc

      - name: Verify Tauri application executable
        shell: powershell
        run: |
          $appExe = "src-tauri\target\x86_64-pc-windows-msvc\release\polza-agent-studio.exe"

          if (!(Test-Path $appExe)) {
            Write-Host "Target-specific executable not found."

            $fallback = "src-tauri\target\release\polza-agent-studio.exe"

            if (Test-Path $fallback) {
              $appExe = $fallback
            }
          }

          if (!(Test-Path $appExe)) {
            Write-Host "Searching for generated polza-agent-studio.exe files:"
            Get-ChildItem "src-tauri\target" -Filter "polza-agent-studio.exe" -Recurse -File -ErrorAction SilentlyContinue |
              Select-Object FullName, Length

            throw "Windows application executable was not created."
          }

          $file = Get-Item $appExe

          Write-Host "Application EXE: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"

          if ($file.Length -le 0) {
            throw "Application executable has invalid size."
          }

          $bytes = [System.IO.File]::ReadAllBytes($file.FullName)

          if (
            $bytes.Length -lt 2 -or
            $bytes[0] -ne 0x4D -or
            $bytes[1] -ne 0x5A
          ) {
            throw "Application executable is not a valid Windows PE executable."
          }

          $hash = Get-FileHash $file.FullName -Algorithm SHA256

          Write-Host "SHA256: $($hash.Hash)"
          Write-Host "Application EXE verification: PASS"

      - name: Verify NSIS installer
        shell: powershell
        run: |
          $installerDir = "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis"

          if (!(Test-Path $installerDir)) {
            $installerDir = "src-tauri\target\release\bundle\nsis"
          }

          if (!(Test-Path $installerDir)) {
            Write-Host "Searching for NSIS installers:"
            Get-ChildItem "src-tauri\target" -Filter "*.exe" -Recurse -File -ErrorAction SilentlyContinue |
              Select-Object FullName, Length

            throw "NSIS installer directory was not created."
          }

          $installers = @(Get-ChildItem $installerDir -Filter "*.exe" -File)

          if ($installers.Count -eq 0) {
            throw "No NSIS installer EXE was created."
          }

          foreach ($installer in $installers) {
            Write-Host ""
            Write-Host "Installer: $($installer.FullName)"
            Write-Host "Size: $($installer.Length) bytes"

            if ($installer.Length -le 0) {
              throw "Installer has invalid size."
            }

            $bytes = [System.IO.File]::ReadAllBytes($installer.FullName)

            if (
              $bytes.Length -lt 2 -or
              $bytes[0] -ne 0x4D -or
              $bytes[1] -ne 0x5A
            ) {
              throw "$($installer.Name) is not a valid Windows executable."
            }

            $hash = Get-FileHash $installer.FullName -Algorithm SHA256

            Write-Host "SHA256: $($hash.Hash)"
            Write-Host "Installer verification: PASS"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Polza-Agent-Studio-Windows-Installer
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Polza-Agent-Studio-Windows-Portable
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/polza-agent-studio.exe
            src-tauri/target/release/polza-agent-studio.exe
          if-no-files-found: error

      - name: Final build summary
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "POLZA AGENT STUDIO WINDOWS BUILD"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Generated EXE files:"

          Get-ChildItem "src-tauri\target" -Filter "*.exe" -Recurse -File |
            ForEach-Object {
              Write-Host ""
              Write-Host "FILE: $($_.FullName)"
              Write-Host "SIZE: $($_.Length)"
              Write-Host "SHA256: $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)"
            }

          Write-Host ""
          Write-Host "BUILD STATUS: SUCCESS"
