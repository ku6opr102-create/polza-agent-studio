[package]
name = "polza-agent-studio"
version = "1.1.0"
description = "Polza Agent Studio"
authors = ["Polza Agent Studio"]
edition = "2021"

[lib]
name = "polza_agent_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "polza-agent-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["linux-native", "sync-secret-service", "crypto-rust"] }
